# HTTP -> HTTPS redirect server block.
# Only used when NGINX_HTTPS_ENABLED=true.
# $host and $request_uri are nginx runtime variables (not envsubst targets).

server {
    listen 80;
    server_name dify.cgu.edu;

    # Allow ACME challenge for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
